name: YouTube Auto-SEO System

# Niche, geos, publish time, upload days waghera ab yahan NAHI hain —
# wo sab "channels_config.json" (repo root) mein set hote hain.
# Ye file sirf SECRETS ko environment mein pass karti hai.

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}  # Manual "Run" button bhi milega testing ke liye

permissions:
  contents: write  # Zaroori hai taake tracking_sheet_*.xlsx ko repo mein commit kar sake

jobs:
  run-seo-update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies install karo
        run: pip install -r scripts/requirements.txt

      - name: SEO automation script chalao
        env:
          # --- Shared secrets (sab channels ke liye common) ---
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          QUOTA_SAFETY_LIMIT: "9000"

          # --- Channel 1 (pehla/mojooda channel — bina prefix ke secrets) ---
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: UCpGN30GrXAP3mMCI5U6eZLQ
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          DRIVE_SHORTS_TOUPLOAD_FOLDER_ID: ${{ secrets.DRIVE_SHORTS_TOUPLOAD_FOLDER_ID }}
          DRIVE_SHORTS_UPLOADED_FOLDER_ID: ${{ secrets.DRIVE_SHORTS_UPLOADED_FOLDER_ID }}
          DRIVE_LONG_TOUPLOAD_FOLDER_ID: ${{ secrets.DRIVE_LONG_TOUPLOAD_FOLDER_ID }}
          DRIVE_LONG_UPLOADED_FOLDER_ID: ${{ secrets.DRIVE_LONG_UPLOADED_FOLDER_ID }}

          # --- Channel 2 (OPTIONAL) ---
          # Naya channel add karne ke liye:
          #   1. channels_config.json mein naya object add karein, "secret_prefix": "CH2_"
          #   2. GitHub Secrets mein neeche wale naam se secrets banayein (CH2_ prefix ke sath)
          #   3. Neeche ki 9 lines se "#" hata dein (uncomment)
          # CH2_YOUTUBE_API_KEY: ${{ secrets.CH2_YOUTUBE_API_KEY }}
          # CH2_YOUTUBE_CHANNEL_ID: ${{ secrets.CH2_YOUTUBE_CHANNEL_ID }}
          # CH2_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.CH2_YOUTUBE_OAUTH_CLIENT_ID }}
          # CH2_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.CH2_YOUTUBE_OAUTH_CLIENT_SECRET }}
          # CH2_YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.CH2_YOUTUBE_OAUTH_REFRESH_TOKEN }}
          # CH2_DRIVE_SHORTS_TOUPLOAD_FOLDER_ID: ${{ secrets.CH2_DRIVE_SHORTS_TOUPLOAD_FOLDER_ID }}
          # CH2_DRIVE_SHORTS_UPLOADED_FOLDER_ID: ${{ secrets.CH2_DRIVE_SHORTS_UPLOADED_FOLDER_ID }}
          # CH2_DRIVE_LONG_TOUPLOAD_FOLDER_ID: ${{ secrets.CH2_DRIVE_LONG_TOUPLOAD_FOLDER_ID }}
          # CH2_DRIVE_LONG_UPLOADED_FOLDER_ID: ${{ secrets.CH2_DRIVE_LONG_UPLOADED_FOLDER_ID }}

          # --- Channel 3 (OPTIONAL) — same pattern, prefix "CH3_" ---
          # CH3_YOUTUBE_API_KEY: ${{ secrets.CH3_YOUTUBE_API_KEY }}
          # CH3_YOUTUBE_CHANNEL_ID: ${{ secrets.CH3_YOUTUBE_CHANNEL_ID }}
          # CH3_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.CH3_YOUTUBE_OAUTH_CLIENT_ID }}
          # CH3_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.CH3_YOUTUBE_OAUTH_CLIENT_SECRET }}
          # CH3_YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.CH3_YOUTUBE_OAUTH_REFRESH_TOKEN }}
          # CH3_DRIVE_SHORTS_TOUPLOAD_FOLDER_ID: ${{ secrets.CH3_DRIVE_SHORTS_TOUPLOAD_FOLDER_ID }}
          # CH3_DRIVE_SHORTS_UPLOADED_FOLDER_ID: ${{ secrets.CH3_DRIVE_SHORTS_UPLOADED_FOLDER_ID }}
          # CH3_DRIVE_LONG_TOUPLOAD_FOLDER_ID: ${{ secrets.CH3_DRIVE_LONG_TOUPLOAD_FOLDER_ID }}
          # CH3_DRIVE_LONG_UPLOADED_FOLDER_ID: ${{ secrets.CH3_DRIVE_LONG_UPLOADED_FOLDER_ID }}
        run: python scripts/seo_automation.py

      - name: Tracking sheets aur keyword data ko repo mein save karo
        run: |
          git config user.name "seo-automation-bot"
          git config user.email "actions@github.com"
          git add tracking_sheet_*.xlsx winning_keywords_*.json || true
          git diff --cached --quiet || git commit -m "Data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
