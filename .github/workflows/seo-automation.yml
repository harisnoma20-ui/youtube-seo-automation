name: YouTube Auto-SEO System

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-seo-update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Debug config
        run: |
          echo "SHA: $(git rev-parse HEAD)  REF: $GITHUB_REF"
          git log -1 --oneline -- channels_config.json
          pwd && ls -la
          find . -name 'channels_config*' -not -path './.git/*'
          sha256sum channels_config.json
          cat channels_config.json
          echo "--- where do the placeholders live? ---"
          grep -rn "YOUR NICHE KEYWORDS" . --exclude-dir=.git || true
          grep -rn "channel1" . --exclude-dir=.git || true
          echo "--- env reads and defaults in the script ---"
          grep -n -E "environ|getenv" scripts/seo_automation.py || true

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies install karo
        run: pip install -r scripts/requirements.txt

      - name: SEO automation script chalao
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          QUOTA_SAFETY_LIMIT: "9000"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          DRIVE_SHORTS_TOUPLOAD_FOLDER_ID: ${{ secrets.DRIVE_SHORTS_TOUPLOAD_FOLDER_ID }}
          DRIVE_SHORTS_UPLOADED_FOLDER_ID: ${{ secrets.DRIVE_SHORTS_UPLOADED_FOLDER_ID }}
          DRIVE_LONG_TOUPLOAD_FOLDER_ID: ${{ secrets.DRIVE_LONG_TOUPLOAD_FOLDER_ID }}
          DRIVE_LONG_UPLOADED_FOLDER_ID: ${{ secrets.DRIVE_LONG_UPLOADED_FOLDER_ID }}
        run: python scripts/seo_automation.py

      - name: Tracking sheets aur keyword data ko repo mein save karo
        run: |
          git config user.name "seo-automation-bot"
          git config user.email "actions@github.com"
          git add tracking_sheet_*.xlsx winning_keywords_*.json || true
          git diff --cached --quiet || git commit -m "Data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
